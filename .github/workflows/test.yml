name: Pull Request Workflow

on:
  pull_request:
    branches: [ master ]  # 仅当 Pull Request 目标分支是 main 时触发

jobs:
  Run_Milvus:
    strategy:
      fail-fast: false
      matrix:
        os: ["ubuntu-latest", "macos-latest", "windows-latest"]
#        os: ["macos-latest"]
    runs-on: ${{ matrix.os }}

    outputs:
      host: ${{ steps.db_info.outputs.host }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4  # 检出代码

#      - if : runner.os == 'macOS'
#        name: Environment dependence
#        uses: ./.github/actions/dependence
#        with:
#          java: "8"
#
#      - if : runner.os != 'macOS'
#        name: Environment dependence
#        uses: ./.github/actions/dependence
#        with:
#          java: "8"

      - name: Set up JDK ${{ inputs.java }}
        uses: actions/setup-java@v4
        with:
          java-version: 8
          distribution: ${{ runner.os == 'macOS' && 'liberica' || 'temurin' }}
          cache: "maven"

      - name: show runner info
        shell: bash
        run: |
          pwd
          whoami
          uname -m
          uname -a
          java -version

      - name: Run DB
        uses: ./.github/actions/dbRunner
        with:
          DB-name: "Neo4j"

      - name: show runner info1
        shell: bash
        run: |
          pwd
          whoami
          uname -m
          uname -a
          java -version

      - if : runner.os != 'Windows'
        name: Network test
        shell: bash
        run: |
          for port in 7687 7688 7689; do
            if netstat -an | grep -q ".*:$port.*LISTEN"; then
              echo "Port $port is open."
            else
              echo "Port $port is not open."
            fi
          done

      - name: Run tests
        shell: bash
        run: |
          mvn clean package
          mvn test
          docker ps